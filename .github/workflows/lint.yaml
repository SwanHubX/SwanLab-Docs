name: "Lint & Format"

# PR gate only — merges into main must not re-run these checks.
on:
  pull_request:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      # pnpm 版本读 package.json 的 packageManager 字段（需在 setup-node 前安装，
      # 否则 cache: pnpm 找不到 pnpm 可执行文件）
      - name: 🟦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Check formatting
        run: pnpm run fmt:check

      - name: 🔍 Lint
        run: pnpm run lint
